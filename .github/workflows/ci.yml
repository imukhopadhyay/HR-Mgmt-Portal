name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: "22"
  # Throwaway credentials for the ephemeral CI database only.
  DATABASE_URL: postgresql://hrportal:hrportal@localhost:5432/hrportal_e2e?schema=public
  DIRECT_DATABASE_URL: postgresql://hrportal:hrportal@localhost:5432/hrportal_e2e?schema=public
  TEST_DATABASE_URL: postgresql://hrportal:hrportal@localhost:5432/hrportal_test?schema=public
  SESSION_SECRET: ci-only-secret-0123456789abcdef0123456789abcdef
  CRON_SECRET: ci-only-cron-secret-0123456789
  EMAIL_DRIVER: disabled
  STORAGE_DRIVER: local
  APP_URL: http://localhost:3000

jobs:
  quality:
    name: Lint, typecheck, unit & integration tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: hrportal
          POSTGRES_PASSWORD: hrportal
          POSTGRES_DB: hrportal_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U hrportal" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npx prisma validate
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run format:check
      - run: npm run test:unit
      - run: npm run test:integration
      - name: Migration drift check (schema.prisma must match committed migrations)
        run: |
          PGPASSWORD=hrportal psql -h localhost -U hrportal -d hrportal_test -c "CREATE DATABASE hrportal_shadow"
          npx prisma migrate diff --from-migrations prisma/migrations --to-schema-datamodel prisma/schema.prisma \
            --shadow-database-url "postgresql://hrportal:hrportal@localhost:5432/hrportal_shadow" --exit-code
      - name: Dependency audit (production, high+)
        run: npm audit --omit=dev --audit-level=critical

  e2e:
    name: Build & end-to-end tests
    runs-on: ubuntu-latest
    needs: quality
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: hrportal
          POSTGRES_PASSWORD: hrportal
          POSTGRES_DB: hrportal_e2e
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U hrportal" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Apply migrations and seed synthetic data
        run: npm run db:deploy && npm run db:seed
      - name: Migration replay check (all migrations apply cleanly to an empty schema)
        run: DATABASE_URL="${DATABASE_URL/schema=public/schema=rollback_check}" npx prisma migrate deploy
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Playwright
        run: npm run test:e2e
        env:
          CI: "true"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
